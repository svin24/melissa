# Container (packaging/container). SELinux confinement is the outer container's business: the
# kernel reports SELinux as disabled inside, so k3s must not try to label.
selinux: false
kubelet-arg:
  # Rootless podman: tolerate what a user namespace forbids (/dev/kmsg, some sysctls).
  # A no-op when the container runs rootful.
  - "feature-gates=KubeletInUserNamespace=true"
kube-proxy-arg:
  # Leave the host's conntrack table size alone (kind does the same).
  - "conntrack-max-per-core=0"
