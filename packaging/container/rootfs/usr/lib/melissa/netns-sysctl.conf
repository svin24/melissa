# The container's own network namespace: net.* keys only (namespaced; never kernel.*, vm.*, fs.*).
# The same keys as the Sysctl= lines in packaging/container/melissa.container (test-install.sh checks
# they match). The Quadlet sets them when podman creates the container; melissa-netns-sysctl.service
# sets them again at boot from this file, so an image-only update (old Quadlet) keeps them.
# Not in a sysctl.d directory on purpose: nothing generic may pick it up. Format: key=value per line.
net.ipv4.conf.default.rp_filter=2
net.ipv4.conf.eth0.rp_filter=2
net.ipv4.conf.default.accept_source_route=0
net.ipv4.conf.eth0.accept_source_route=0
net.ipv4.conf.default.promote_secondaries=1
net.ipv4.conf.eth0.promote_secondaries=1
net.ipv4.ping_group_range=0 2147483647
