# Container image only: replaces packaging/common/usr/lib/sysusers.d/melissa.conf (copied after it).
# The ids are FIXED here because Melissa's data lives on a volume that outlives the image: files under
# /var/lib/melissa and /etc/melissa are owned by these numbers. Left to systemd-sysusers, the ids are
# handed out from 999 down at every start and shift whenever the image gains or loses a package with
# system users (2026-11-28: dropping systemd-udev moved melissa 994 -> 996 and the server could no
# longer read its own data). 994/995 are what every image before that change gave out. Never change them.
#
# Group that may read the server's k3s kubeconfig in /run/melissa-kube (written by root,
# melissa-kubeconfig.service). Only melissa-server.service gets it (SupplementaryGroups=).
g melissa-kube 995 - -
# The system server and the agent CLIs it runs (melissa-server.service, User=melissa). Not a login user.
u melissa 994 "Melissa server and its agents" /var/lib/melissa/home /usr/sbin/nologin
