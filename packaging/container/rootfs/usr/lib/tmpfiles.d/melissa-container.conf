# Container: k3s's node password lives on the /var volume (see packaging/container/Containerfile).
d /var/lib/melissa-container/rancher-node 0700 root root -
# Factory reset requests (Settings → Reset): the server's user writes the marker here, root's
# melissa-factory-reset.path watches it (melissa_settings::factory_reset).
d /var/lib/melissa-container/reset 0770 root melissa -
# The server's config directory on the volume: see melissa-config.conf (replaces the common rule).
# Update requests (bind mount from the host, only with install.sh): the server's user may create files.
# `z` only adjusts an existing path, so without the mount nothing appears and Settings shows commands.
z /run/melissa-update-request 0770 root melissa -
# Multi-device (melissa_settings::cluster): root's cluster state on the /var volume (the cluster
# setting k3s and the firewall act on, the pinned k3s node name, an agent's join token). Root only:
# the server's user can't change who this device trusts. Wiped by a factory reset.
d /var/lib/melissa-container/cluster 0700 root root -
