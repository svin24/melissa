# Container: k3s's node password lives on the /var volume (see packaging/container/Containerfile).
d /var/lib/melissa-container/rancher-node 0700 root root -
# The queen's config directory on the volume: see melissa-config.conf (replaces the common rule).
# Update requests (bind mount from the host, only with install.sh): the queen's user may create files.
# `z` only adjusts an existing path, so without the mount nothing appears and Settings shows commands.
z /run/melissa-update-request 0770 root melissa -
