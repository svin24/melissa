# Logs of melissa-agent-install@.service and melissa-agent-login@.service, read by the server
# (Settings → Providers). Only root and the group melissa get in.
d /run/melissa-agent-install 0750 root melissa -
# Claude's sign-in code, pasted on the page: the server (group melissa) writes one line, the login
# unit (root) reads it (melissa-setup login_claude_from_page). Nobody else can reach it.
p /run/melissa-agent-install/claude-login.code 0620 root melissa -
