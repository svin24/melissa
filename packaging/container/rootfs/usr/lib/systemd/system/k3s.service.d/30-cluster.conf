# Container: this device's cluster role and node name (melissa_settings::cluster). k3s-prepare runs
# `melissa-server cluster prepare`, which names the node after the device name from setup, else the
# Tailscale name install.sh passed (melissa-<host>), so two installs never both register `melissa`.
# In a cluster, flannel runs on Melissa's own tailscale0: start after it (no-op when it is off).
[Unit]
After=melissa-tailscaled.service

[Service]
PassEnvironment=MELISSA_TAILSCALE_NAME MELISSA_HOST_TAILSCALE
# After a rename (a server without app volumes): delete the old node object. Best effort.
ExecStartPost=-/usr/bin/melissa-server cluster after-start
