# Container: the host publishes the app ports on every address and Melissa's filter decides who
# gets through (melissa-app-access.service). Fail closed: k3s, which serves the app ports, starts
# only once the filter's table is in place (whatever it lets in: the setting, this device, or
# nothing).
[Unit]
Wants=melissa-app-access.service
After=melissa-app-access.service

[Service]
ExecStartPre=/bin/sh -c 'exec /usr/sbin/nft list table inet melissa_app_access >/dev/null'
