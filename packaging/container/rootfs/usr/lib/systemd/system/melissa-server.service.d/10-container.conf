# Container: Settings → Updates asks the host helper for check/apply/rollback by creating an empty
# file in this bind mount (melissa.container; host: /var/lib/melissa-container/request). The status
# comes back read-only in /run/melissa-update. "-": absent when run without install.sh (dev).
[Service]
ReadWritePaths=-/run/melissa-update-request
# Settings → Reset writes the factory reset request here (root's melissa-factory-reset.path acts).
ReadWritePaths=-/var/lib/melissa-container/reset
# Where the host publishes the app ports (melissa.container: install.sh's BIND). Services don't see
# the container's environment unless passed on; unset or empty: app addresses are probed instead.
PassEnvironment=MELISSA_PUBLISH_BIND
# Settings → Tailscale (melissa.container: install.sh saw Tailscale on the host or not; the node name).
# Unset: not checked, so Melissa doesn't offer its own Tailscale.
PassEnvironment=MELISSA_HOST_TAILSCALE MELISSA_TAILSCALE_NAME
