# gVisor pinned for apps with isolation `gvisor` (the default for agent specs; docs/DECISIONS.md
# 2026-11-23). Sourced as shell by the image build, which ships Google's official static release
# binaries (Apache-2.0) from storage.googleapis.com/gvisor: runsc, containerd-shim-runsc-v1 and the
# runsc sidecars it needs next to it (gvisor-bin/: the Sentry and three small helpers; not the
# checkpoint, network-gofer or metrics binaries). Update: bump the version (a release-YYYYMMDD.N
# tag), then
#   curl -fsSL https://storage.googleapis.com/gvisor/releases/release/<version>/x86_64/gvisor.tar.bz2.sha512
# (and check it against `curl -fsSL <tarball> | sha512sum`), and the license at the release tag:
#   curl -fsSL https://raw.githubusercontent.com/google/gvisor/release-<version>/LICENSE | sha256sum
# If a hash differs, read the diff before updating it. Then `just gvisor-test-image`.
