# Tailscale pinned for Melissa's own Tailscale (Settings → Tailscale; off by default; docs/DECISIONS.md
# 2026-11-21). Sourced as shell by the image build, which ships the official static binaries
# (tailscale, tailscaled; BSD-3-Clause) from pkgs.tailscale.com. Update: bump the version, then
#   curl -fsSL https://pkgs.tailscale.com/stable/tailscale_<version>_amd64.tgz.sha256
# (and check it against `curl -fsSL <tgz> | sha256sum`). The license files at the release tag ship in
# /usr/share/licenses/tailscale/:
#   curl -fsSL https://raw.githubusercontent.com/tailscale/tailscale/v<version>/LICENSE | sha256sum
#   curl -fsSL https://raw.githubusercontent.com/tailscale/tailscale/v<version>/licenses/tailscale.md | sha256sum
# (the second lists the Go modules built into the binaries and their licenses). If a hash differs,
# read the diff before updating it.
