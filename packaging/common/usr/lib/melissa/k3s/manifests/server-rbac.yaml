# Melissa: the server's read-only identity in k3s (cluster_health and other read-only tools).
# No access to Secrets, no writes. App installs use a separate identity, melissa-apps
# (apps-rbac.yaml), held only by the app tools.
# The server gets a kubeconfig for this ServiceAccount from melissa-kubeconfig.service;
# it never sees k3s's admin kubeconfig.
apiVersion: v1
kind: Namespace
metadata:
  name: melissa
  labels:
    melissa.io/managed: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melissa-server
  namespace: melissa
# Pods never run as this account; don't mount its token anywhere by default.
automountServiceAccountToken: false
---
# Long-lived token for the server (see docs/DECISIONS.md, 2026-11-18). Revoke or rotate
# with `/usr/libexec/melissa/melissa-kubeconfig rotate`. Must come after the ServiceAccount.
apiVersion: v1
kind: Secret
metadata:
  name: melissa-server-token
  namespace: melissa
  annotations:
    kubernetes.io/service-account.name: melissa-server
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-server-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: melissa-server-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: melissa-server-read
subjects:
  - kind: ServiceAccount
    name: melissa-server
    namespace: melissa
