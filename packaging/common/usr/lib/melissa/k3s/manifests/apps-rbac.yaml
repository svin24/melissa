# Melissa: the write identity for app installs (ServiceAccount melissa/melissa-apps), separate
# from the read-only melissa-server. Only the lead agent's app tools (install_app, stop_app,
# start_app, uninstall_app, app_status, app_logs, list_apps) use it; see docs/agent-skills/app-catalog.md and docs/DECISIONS.md.
#
# Shape:
# - Cluster-wide, this identity may only: create/patch/delete Namespaces and create/patch
#   RoleBindings, and bind the melissa-app-workload ClusterRole. The admission policies below
#   pin all of that to namespaces named app-<name> labelled melissa.io/app=<name> with Pod
#   Security "baseline" (or "restricted") enforced, and to RoleBindings that grant exactly
#   melissa-app-workload to exactly this ServiceAccount.
# - Workspaces (docs/AGENT-MODEL.md): every new app namespace carries melissa.io/workspace=<name> and
#   melissa.io/device=<device id>; melissa.io/owner-agent=<agent id> names the agent that owns it
#   (absent: unassigned). The device is fixed once set. The owner agent can only change together
#   with a new melissa.io/assigned-at (and assigned-by) annotation: that is the reassign path
#   (the lead agent's reassign_workspace after the user approved it, or the user's
#   `melissa-server workspace reassign`); an owned workspace never becomes unassigned again. The old
#   melissa.io/owner label (`owner`/`job-<key>`, before agents) may only be dropped. Which agent
#   may act on which workspace is enforced in the server (agents hold no cluster credentials); see
#   docs/agent-skills/workspaces-and-ownership.md.
# - App ports (docs/DECISIONS.md, 2026-11-19): an app namespace may record its own port on the
#   device (annotation melissa.io/port, 30000-30079), which never changes while the namespace
#   exists; its one NodePort Service `<app>-port` must use exactly that range. Everything else
#   stays ClusterIP.
# - Inside an app namespace, the RoleBinding the installer creates grants melissa-app-workload:
#   workloads, Services, Ingresses, PVCs, ConfigMaps; Secrets create/delete only (never read:
#   generated credentials are for the owner); pods and logs read.
# - Nothing in kube-system or any other namespace; no PersistentVolumes, no nodes, no exec.
# The token reaches the server as /run/melissa-kube/apps.kubeconfig (melissa-kubeconfig).
#
# Admission policies come first so they exist before the permissions do.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  variables:
    - name: ns
      expression: "request.operation == 'DELETE' ? oldObject : object"
    # A fresh assignment record: assigned-by and assigned-at present, assigned-at new.
    - name: newAssignment
      expression: >-
        request.operation != 'DELETE' && has(object.metadata.annotations) &&
        'melissa.io/assigned-by' in object.metadata.annotations &&
        'melissa.io/assigned-at' in object.metadata.annotations &&
        (request.operation != 'UPDATE' || !has(oldObject.metadata.annotations) ||
         !('melissa.io/assigned-at' in oldObject.metadata.annotations) ||
         object.metadata.annotations['melissa.io/assigned-at'] !=
           oldObject.metadata.annotations['melissa.io/assigned-at'])
    # Labels from before the rename to generic terms (docs/DECISIONS.md, 2026-11-19).
    - name: oldLabels
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels) ?
          oldObject.metadata.labels : {}
    # The one-time relabel: the owner moves from melissa.io/owner-bee=c-<hex>.b<n> to
    # melissa.io/owner-agent=d-<hex>.a<n> (same agent, new id shape).
    - name: ownerRelabelled
      expression: >-
        'melissa.io/owner-bee' in variables.oldLabels &&
        variables.oldLabels['melissa.io/owner-bee'].matches('^c-[0-9a-f]{8}[.]b[1-9][0-9]{0,8}$') &&
        'melissa.io/owner-agent' in object.metadata.labels &&
        object.metadata.labels['melissa.io/owner-agent'] ==
          'd-' + variables.oldLabels['melissa.io/owner-bee'].substring(2, 11) + 'a' +
          variables.oldLabels['melissa.io/owner-bee'].substring(12)
  validations:
    - expression: "variables.ns.metadata.name.startsWith('app-')"
      message: "melissa-apps may only manage namespaces named app-<name>"
    - expression: >-
        has(variables.ns.metadata.labels) &&
        'melissa.io/app' in variables.ns.metadata.labels &&
        variables.ns.metadata.labels['melissa.io/app'] == variables.ns.metadata.name.substring(4)
      message: "app namespaces must carry melissa.io/app=<name>"
    - expression: >-
        request.operation == 'DELETE' ||
        ('pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'])
      message: "app namespaces must enforce Pod Security baseline or restricted"
    - expression: >-
        request.operation != 'CREATE' ||
        ('melissa.io/workspace' in object.metadata.labels &&
         object.metadata.labels['melissa.io/workspace'] == object.metadata.name.substring(4) &&
         'melissa.io/device' in object.metadata.labels &&
         !('melissa.io/owner' in object.metadata.labels))
      message: "new workspaces must carry melissa.io/workspace=<name> and melissa.io/device=<device id>"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/device' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/device'].matches('^d-[0-9a-f]{8}$')
      message: "melissa.io/device must be a device id (d-<8 hex>)"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/owner-agent' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/owner-agent'].matches('^d-[0-9a-f]{8}[.]a[1-9][0-9]{0,8}$')
      message: "melissa.io/owner-agent must be an agent id (<device id>.a<n>)"
    - expression: >-
        request.operation != 'UPDATE' ||
        !(has(oldObject.metadata.labels) && 'melissa.io/device' in oldObject.metadata.labels) ||
        ('melissa.io/device' in object.metadata.labels &&
         object.metadata.labels['melissa.io/device'] == oldObject.metadata.labels['melissa.io/device'])
      message: "a workspace's device never changes"
    # Old label keys (melissa.io/cell, melissa.io/comb, melissa.io/owner-bee) are only ever
    # kept as they are or dropped; the new keys take their values (ids in the new shape).
    - expression: >-
        request.operation == 'DELETE' ||
        ['melissa.io/cell', 'melissa.io/comb', 'melissa.io/owner-bee'].all(k,
          !(k in object.metadata.labels) ||
          (k in variables.oldLabels && object.metadata.labels[k] == variables.oldLabels[k]))
      message: "the old melissa.io/cell, melissa.io/comb and melissa.io/owner-bee labels may only be kept or dropped"
    - expression: >-
        request.operation != 'UPDATE' ||
        !('melissa.io/comb' in variables.oldLabels) ||
        'melissa.io/device' in variables.oldLabels ||
        !('melissa.io/device' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/device'] ==
          'd-' + variables.oldLabels['melissa.io/comb'].substring(2)
      message: "a workspace's melissa.io/device takes its old melissa.io/comb id (c-<hex> becomes d-<hex>)"
    - expression: >-
        request.operation != 'UPDATE' ||
        !('melissa.io/owner-bee' in variables.oldLabels) ||
        'melissa.io/owner-bee' in object.metadata.labels ||
        'melissa.io/owner-agent' in object.metadata.labels
      message: "the old melissa.io/owner-bee label may only be dropped for melissa.io/owner-agent"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/owner' in object.metadata.labels) ||
        (request.operation == 'UPDATE' && has(oldObject.metadata.labels) &&
         'melissa.io/owner' in oldObject.metadata.labels &&
         object.metadata.labels['melissa.io/owner'] == oldObject.metadata.labels['melissa.io/owner'])
      message: "the old melissa.io/owner label may only be kept or dropped"
    - expression: >-
        request.operation != 'CREATE' ||
        !('melissa.io/owner-agent' in object.metadata.labels) || variables.newAssignment
      message: "a new workspace's owner agent needs melissa.io/assigned-by and melissa.io/assigned-at"
    - expression: >-
        request.operation != 'UPDATE' ||
        ((has(oldObject.metadata.labels) && 'melissa.io/owner-agent' in oldObject.metadata.labels) ?
          ('melissa.io/owner-agent' in object.metadata.labels &&
           (object.metadata.labels['melissa.io/owner-agent'] == oldObject.metadata.labels['melissa.io/owner-agent'] ||
            variables.newAssignment)) :
          (!('melissa.io/owner-agent' in object.metadata.labels) || variables.newAssignment ||
           variables.ownerRelabelled))
      message: "a workspace's owner agent changes only through the reassign path (new melissa.io/assigned-at)"
    - expression: >-
        request.operation == 'DELETE' || !has(object.metadata.annotations) ||
        !('melissa.io/port' in object.metadata.annotations) ||
        (object.metadata.annotations['melissa.io/port'].matches('^300[0-7][0-9]$'))
      message: "melissa.io/port must be an app port (30000-30079)"
    - expression: >-
        request.operation != 'UPDATE' || !has(oldObject.metadata.annotations) ||
        !('melissa.io/port' in oldObject.metadata.annotations) ||
        (has(object.metadata.annotations) && 'melissa.io/port' in object.metadata.annotations &&
         object.metadata.annotations['melissa.io/port'] == oldObject.metadata.annotations['melissa.io/port'])
      message: "an app's port never changes while its namespace exists"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-namespaces
spec:
  policyName: melissa-apps-namespaces
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        resources: ["rolebindings"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  validations:
    - expression: >-
        request.namespace.startsWith('app-') &&
        has(namespaceObject.metadata.labels) &&
        'melissa.io/app' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['melissa.io/app'] == request.namespace.substring(4)
      message: "melissa-apps may only bind roles in app-<name> namespaces"
    - expression: >-
        request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'melissa-app-workload')
      message: "melissa-apps may only bind the melissa-app-workload ClusterRole"
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.subjects) && object.subjects.size() == 1 &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'melissa-apps' &&
                                has(s.namespace) && s.namespace == 'melissa'))
      message: "melissa-apps may only bind the role to itself"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-rolebindings
spec:
  policyName: melissa-apps-rolebindings
  validationActions: [Deny]
---
# Services stay inside the cluster, except each app's one NodePort Service `<app>-port` on a
# port from Melissa's app range (30000-30079, the static band of k3s's NodePort range): no
# LoadBalancer (k3s's service load balancer would open arbitrary host ports), no other
# NodePorts, no externalIPs (CVE-2020-8554). Apps are reached at http://<device>:<port> and
# through Ingress.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["services"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  validations:
    - expression: >-
        !has(object.spec.type) || object.spec.type == 'ClusterIP' ||
        (object.spec.type == 'NodePort' &&
         object.metadata.name == request.namespace.substring(4) + '-port')
      message: "app Services must be ClusterIP, except the app's NodePort Service <app>-port"
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'NodePort' ||
        (object.spec.ports.size() == 1 && has(object.spec.ports[0].nodePort) &&
         object.spec.ports[0].nodePort >= 30000 && object.spec.ports[0].nodePort <= 30079)
      message: "an app's NodePort Service has one port with a nodePort in 30000-30079"
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "app Services may not set externalIPs"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-services
spec:
  policyName: melissa-apps-services
  validationActions: [Deny]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melissa-apps
  namespace: melissa
automountServiceAccountToken: false
---
# Long-lived token, like melissa-server-token (see DECISIONS.md). Rotate with
# `/usr/libexec/melissa/melissa-kubeconfig rotate apps`.
apiVersion: v1
kind: Secret
metadata:
  name: melissa-apps-token
  namespace: melissa
  annotations:
    kubernetes.io/service-account.name: melissa-apps
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-apps
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["melissa-app-workload"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: melissa-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: melissa-apps
subjects:
  - kind: ServiceAccount
    name: melissa-apps
    namespace: melissa
---
# Never bound cluster-wide: only per app namespace, by the installer (RoleBinding melissa-apps).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-app-workload
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Generated credentials: written once, never read back by Melissa (the owner reads them
  # with root's admin kubeconfig: `sudo melissa-server app-credentials <app>`).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # The user's force delete removes pods stuck in a terminating app namespace (grace 0).
  # Delete only: Melissa never creates bare pods, and no exec/attach.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
