# Melissa: the write identity for app installs (ServiceAccount melissa/melissa-apps), separate
# from the read-only melissa-server. Only the app tools (deploy_app, update_app, stop_app,
# start_app, uninstall_app, app_status, app_logs, app_exec, list_apps) use it; see docs/agent-skills/app-deploy.md and docs/DECISIONS.md.
# Agents write the app specs (any image, any app); these policies are what holds whatever the
# server renders from them to the rules below, independent of the server's own validation.
#
# Shape:
# - Cluster-wide, this identity may only: list/get/create/patch/delete Namespaces (listing finds
#   the apps; it reads namespace metadata only) and create/patch RoleBindings, and bind the
#   melissa-app-workload ClusterRole. The admission policies below
#   pin all of that to namespaces named app-<name> labelled melissa.io/app=<name> with Pod
#   Security "baseline" (or "restricted") enforced, and to RoleBindings that grant exactly
#   melissa-app-workload to exactly this ServiceAccount.
# - Workspaces (docs/AGENT-MODEL.md): every new app namespace carries melissa.io/workspace=<name> and
#   melissa.io/device=<device id>; melissa.io/owner-agent=<agent id> names the agent that owns it
#   (absent: unassigned). The device is fixed once set. The owner agent can only change together
#   with a new melissa.io/assigned-at (and assigned-by) annotation: that is the reassign path
#   (the lead agent's reassign_workspace after the user approved it, or the user's
#   `melissa-server workspace reassign`); an owned workspace never becomes unassigned again. The old
#   melissa.io/owner label (`owner`/`job-<key>`, before agents) may only be dropped. Which agent
#   may act on which workspace is enforced in the server (agents hold no cluster credentials); see
#   docs/agent-skills/workspaces-and-ownership.md.
# - App ports (docs/DECISIONS.md, 2026-11-19): an app namespace may record its web port on the
#   device (annotation melissa.io/port, 30000-30079), which never changes while the namespace
#   exists, and its other public ports (melissa.io/ports, `name:<port>/tcp|udp`, same range);
#   its one NodePort Service `<app>-port` (TCP or UDP ports) must use exactly that range.
#   Everything else stays ClusterIP.
# - Workloads (Deployments, StatefulSets) only in app namespaces with their workspace labels;
#   never privileged, no host network/PID/IPC, no hostPath or other node volumes, no host ports,
#   added capabilities only from Pod Security baseline's default set, seccomp RuntimeDefault,
#   CPU and memory limits on every container, no service account token. Root inside the
#   container is allowed (many images need it), privileges never.
# - Volumes: new PVCs use the local-path class and never bind a chosen PersistentVolume or
#   copy another claim (volumeName, dataSource).
# - Inside an app namespace, the RoleBinding the installer creates grants melissa-app-workload:
#   workloads, Services, Ingresses, PVCs, ConfigMaps; Secrets create/delete only (never read:
#   generated credentials are for the owner); pods and logs read; pods/exec for app_exec
#   (which can see whatever the container sees, its environment included).
# - Nothing in kube-system or any other namespace; no PersistentVolumes, no nodes; no exec,
#   attach or port-forward outside app namespaces.
# The token reaches the server as /run/melissa-kube/apps.kubeconfig (melissa-kubeconfig).
#
# Admission policies come first so they exist before the permissions do.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  variables:
    - name: ns
      expression: "request.operation == 'DELETE' ? oldObject : object"
    # A fresh assignment record: assigned-by and assigned-at present, assigned-at new.
    - name: newAssignment
      expression: >-
        request.operation != 'DELETE' && has(object.metadata.annotations) &&
        'melissa.io/assigned-by' in object.metadata.annotations &&
        'melissa.io/assigned-at' in object.metadata.annotations &&
        (request.operation != 'UPDATE' || !has(oldObject.metadata.annotations) ||
         !('melissa.io/assigned-at' in oldObject.metadata.annotations) ||
         object.metadata.annotations['melissa.io/assigned-at'] !=
           oldObject.metadata.annotations['melissa.io/assigned-at'])
    # Labels from before the rename to generic terms (docs/DECISIONS.md, 2026-11-19).
    - name: oldLabels
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels) ?
          oldObject.metadata.labels : {}
    # The one-time relabel: the owner moves from melissa.io/owner-bee=c-<hex>.b<n> to
    # melissa.io/owner-agent=d-<hex>.a<n> (same agent, new id shape).
    - name: ownerRelabelled
      expression: >-
        'melissa.io/owner-bee' in variables.oldLabels &&
        variables.oldLabels['melissa.io/owner-bee'].matches('^c-[0-9a-f]{8}[.]b[1-9][0-9]{0,8}$') &&
        'melissa.io/owner-agent' in object.metadata.labels &&
        object.metadata.labels['melissa.io/owner-agent'] ==
          'd-' + variables.oldLabels['melissa.io/owner-bee'].substring(2, 11) + 'a' +
          variables.oldLabels['melissa.io/owner-bee'].substring(12)
  validations:
    - expression: "variables.ns.metadata.name.startsWith('app-')"
      message: "melissa-apps may only manage namespaces named app-<name>"
    - expression: >-
        has(variables.ns.metadata.labels) &&
        'melissa.io/app' in variables.ns.metadata.labels &&
        variables.ns.metadata.labels['melissa.io/app'] == variables.ns.metadata.name.substring(4)
      message: "app namespaces must carry melissa.io/app=<name>"
    - expression: >-
        request.operation == 'DELETE' ||
        ('pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] in ['baseline', 'restricted'])
      message: "app namespaces must enforce Pod Security baseline or restricted"
    - expression: >-
        request.operation != 'CREATE' ||
        ('melissa.io/workspace' in object.metadata.labels &&
         object.metadata.labels['melissa.io/workspace'] == object.metadata.name.substring(4) &&
         'melissa.io/device' in object.metadata.labels &&
         !('melissa.io/owner' in object.metadata.labels))
      message: "new workspaces must carry melissa.io/workspace=<name> and melissa.io/device=<device id>"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/device' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/device'].matches('^d-[0-9a-f]{8}$')
      message: "melissa.io/device must be a device id (d-<8 hex>)"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/owner-agent' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/owner-agent'].matches('^d-[0-9a-f]{8}[.]a[1-9][0-9]{0,8}$')
      message: "melissa.io/owner-agent must be an agent id (<device id>.a<n>)"
    - expression: >-
        request.operation != 'UPDATE' ||
        !(has(oldObject.metadata.labels) && 'melissa.io/device' in oldObject.metadata.labels) ||
        ('melissa.io/device' in object.metadata.labels &&
         object.metadata.labels['melissa.io/device'] == oldObject.metadata.labels['melissa.io/device'])
      message: "a workspace's device never changes"
    # Old label keys (melissa.io/cell, melissa.io/comb, melissa.io/owner-bee) are only ever
    # kept as they are or dropped; the new keys take their values (ids in the new shape).
    - expression: >-
        request.operation == 'DELETE' ||
        ['melissa.io/cell', 'melissa.io/comb', 'melissa.io/owner-bee'].all(k,
          !(k in object.metadata.labels) ||
          (k in variables.oldLabels && object.metadata.labels[k] == variables.oldLabels[k]))
      message: "the old melissa.io/cell, melissa.io/comb and melissa.io/owner-bee labels may only be kept or dropped"
    - expression: >-
        request.operation != 'UPDATE' ||
        !('melissa.io/comb' in variables.oldLabels) ||
        'melissa.io/device' in variables.oldLabels ||
        !('melissa.io/device' in object.metadata.labels) ||
        object.metadata.labels['melissa.io/device'] ==
          'd-' + variables.oldLabels['melissa.io/comb'].substring(2)
      message: "a workspace's melissa.io/device takes its old melissa.io/comb id (c-<hex> becomes d-<hex>)"
    - expression: >-
        request.operation != 'UPDATE' ||
        !('melissa.io/owner-bee' in variables.oldLabels) ||
        'melissa.io/owner-bee' in object.metadata.labels ||
        'melissa.io/owner-agent' in object.metadata.labels
      message: "the old melissa.io/owner-bee label may only be dropped for melissa.io/owner-agent"
    - expression: >-
        request.operation == 'DELETE' ||
        !('melissa.io/owner' in object.metadata.labels) ||
        (request.operation == 'UPDATE' && has(oldObject.metadata.labels) &&
         'melissa.io/owner' in oldObject.metadata.labels &&
         object.metadata.labels['melissa.io/owner'] == oldObject.metadata.labels['melissa.io/owner'])
      message: "the old melissa.io/owner label may only be kept or dropped"
    - expression: >-
        request.operation != 'CREATE' ||
        !('melissa.io/owner-agent' in object.metadata.labels) || variables.newAssignment
      message: "a new workspace's owner agent needs melissa.io/assigned-by and melissa.io/assigned-at"
    - expression: >-
        request.operation != 'UPDATE' ||
        ((has(oldObject.metadata.labels) && 'melissa.io/owner-agent' in oldObject.metadata.labels) ?
          ('melissa.io/owner-agent' in object.metadata.labels &&
           (object.metadata.labels['melissa.io/owner-agent'] == oldObject.metadata.labels['melissa.io/owner-agent'] ||
            variables.newAssignment)) :
          (!('melissa.io/owner-agent' in object.metadata.labels) || variables.newAssignment ||
           variables.ownerRelabelled))
      message: "a workspace's owner agent changes only through the reassign path (new melissa.io/assigned-at)"
    - expression: >-
        request.operation == 'DELETE' || !has(object.metadata.annotations) ||
        !('melissa.io/port' in object.metadata.annotations) ||
        (object.metadata.annotations['melissa.io/port'].matches('^300[0-7][0-9]$'))
      message: "melissa.io/port must be an app port (30000-30079)"
    - expression: >-
        request.operation == 'DELETE' || !has(object.metadata.annotations) ||
        !('melissa.io/ports' in object.metadata.annotations) ||
        object.metadata.annotations['melissa.io/ports'].matches('^([a-z][a-z0-9-]{0,14}:300[0-7][0-9]/(tcp|udp))( [a-z][a-z0-9-]{0,14}:300[0-7][0-9]/(tcp|udp))*$')
      message: "melissa.io/ports must list app ports (name:30000-30079/tcp|udp)"
    - expression: >-
        request.operation != 'UPDATE' || !has(oldObject.metadata.annotations) ||
        !('melissa.io/port' in oldObject.metadata.annotations) ||
        (has(object.metadata.annotations) && 'melissa.io/port' in object.metadata.annotations &&
         object.metadata.annotations['melissa.io/port'] == oldObject.metadata.annotations['melissa.io/port'])
      message: "an app's port never changes while its namespace exists"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-namespaces
spec:
  policyName: melissa-apps-namespaces
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        resources: ["rolebindings"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  validations:
    - expression: >-
        request.namespace.startsWith('app-') &&
        has(namespaceObject.metadata.labels) &&
        'melissa.io/app' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['melissa.io/app'] == request.namespace.substring(4)
      message: "melissa-apps may only bind roles in app-<name> namespaces"
    - expression: >-
        request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'melissa-app-workload')
      message: "melissa-apps may only bind the melissa-app-workload ClusterRole"
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.subjects) && object.subjects.size() == 1 &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'melissa-apps' &&
                                has(s.namespace) && s.namespace == 'melissa'))
      message: "melissa-apps may only bind the role to itself"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-rolebindings
spec:
  policyName: melissa-apps-rolebindings
  validationActions: [Deny]
---
# Services stay inside the cluster, except each app's one NodePort Service `<app>-port` with
# its ports from Melissa's app range (30000-30079, the static band of k3s's NodePort range): no
# LoadBalancer (k3s's service load balancer would open arbitrary host ports), no other
# NodePorts, no externalIPs (CVE-2020-8554), TCP and UDP only. Apps are reached at
# <device>:<port> and through Ingress.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["services"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  validations:
    - expression: >-
        !has(object.spec.type) || object.spec.type == 'ClusterIP' ||
        (object.spec.type == 'NodePort' &&
         object.metadata.name == request.namespace.substring(4) + '-port')
      message: "app Services must be ClusterIP, except the app's NodePort Service <app>-port"
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'NodePort' ||
        (object.spec.ports.size() <= 6 &&
         object.spec.ports.all(p, has(p.nodePort) && p.nodePort >= 30000 && p.nodePort <= 30079))
      message: "an app's NodePort Service has at most 6 ports, each with a nodePort in 30000-30079"
    - expression: "object.spec.ports.all(p, !has(p.protocol) || p.protocol in ['TCP', 'UDP'])"
      message: "app Services use TCP or UDP"
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "app Services may not set externalIPs"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-services
spec:
  policyName: melissa-apps-services
  validationActions: [Deny]
---
# What app pods may be, whatever spec they come from. Pod Security "baseline" (enforced on every
# app namespace, see above) checks the pods themselves; this checks the pod templates the write
# identity writes, so a bad one is refused at once with a clear message.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  variables:
    - name: pod
      expression: "object.spec.template.spec"
    # Pod Security baseline's default capabilities: adding them changes nothing; nothing else.
    - name: allowedCaps
      expression: >-
        ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD',
         'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']
  validations:
    - expression: >-
        request.namespace.startsWith('app-') &&
        has(namespaceObject.metadata.labels) &&
        'melissa.io/app' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['melissa.io/app'] == request.namespace.substring(4) &&
        ('melissa.io/workspace' in namespaceObject.metadata.labels ||
         'melissa.io/cell' in namespaceObject.metadata.labels)
      message: "app workloads run only in an app's own workspace namespace (melissa.io/app and melissa.io/workspace labels)"
    - expression: >-
        has(object.spec.template.metadata.labels) &&
        'melissa.io/app' in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels['melissa.io/app'] == request.namespace.substring(4)
      message: "app pods carry melissa.io/app=<name>"
    - expression: >-
        !(has(variables.pod.hostNetwork) && variables.pod.hostNetwork) &&
        !(has(variables.pod.hostPID) && variables.pod.hostPID) &&
        !(has(variables.pod.hostIPC) && variables.pod.hostIPC)
      message: "app pods may not use the host's network, PID or IPC namespaces"
    - expression: >-
        !has(variables.pod.volumes) ||
        variables.pod.volumes.all(v, has(v.persistentVolumeClaim) || has(v.configMap) ||
                                     has(v.secret) || has(v.emptyDir))
      message: "app volumes are PVCs, ConfigMaps, Secrets or emptyDir only (no hostPath)"
    - expression: "!has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers)"
      message: "app pods have no init or ephemeral containers"
    - expression: >-
        variables.pod.containers.all(c, !has(c.securityContext) ||
          !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: "app containers are never privileged"
    - expression: >-
        variables.pod.containers.all(c, !has(c.securityContext) ||
          !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap, cap in variables.allowedCaps))
      message: "app containers may not add capabilities beyond the default set"
    - expression: >-
        variables.pod.containers.all(c, !has(c.ports) ||
          c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))
      message: "app containers may not use host ports (device ports are NodePorts)"
    - expression: >-
        variables.pod.containers.all(c, has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "every app container has CPU and memory limits"
    - expression: >-
        has(variables.pod.securityContext) && has(variables.pod.securityContext.seccompProfile) &&
        variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' &&
        variables.pod.containers.all(c, !has(c.securityContext) ||
          !has(c.securityContext.seccompProfile) ||
          c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: "app pods use the RuntimeDefault seccomp profile"
    - expression: >-
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == 'default') &&
        has(variables.pod.automountServiceAccountToken) && !variables.pod.automountServiceAccountToken
      message: "app pods get no Kubernetes API token"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-workloads
spec:
  policyName: melissa-apps-workloads
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: melissa-apps-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["persistentvolumeclaims"]
        operations: ["CREATE"]
  matchConditions:
    - name: melissa-apps-only
      expression: "request.userInfo.username == 'system:serviceaccount:melissa:melissa-apps'"
  validations:
    - expression: "has(object.spec.storageClassName) && object.spec.storageClassName == 'local-path'"
      message: "app volumes use the local-path storage class"
    - expression: >-
        !has(object.spec.volumeName) && !has(object.spec.dataSource) &&
        !has(object.spec.dataSourceRef)
      message: "app volumes never bind a chosen PersistentVolume or copy other data"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: melissa-apps-volumes
spec:
  policyName: melissa-apps-volumes
  validationActions: [Deny]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melissa-apps
  namespace: melissa
automountServiceAccountToken: false
---
# Long-lived token, like melissa-server-token (see DECISIONS.md). Rotate with
# `/usr/libexec/melissa/melissa-kubeconfig rotate apps`.
apiVersion: v1
kind: Secret
metadata:
  name: melissa-apps-token
  namespace: melissa
  annotations:
    kubernetes.io/service-account.name: melissa-apps
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-apps
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["melissa-app-workload"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: melissa-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: melissa-apps
subjects:
  - kind: ServiceAccount
    name: melissa-apps
    namespace: melissa
---
# Never bound cluster-wide: only per app namespace, by the installer (RoleBinding melissa-apps).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-app-workload
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Generated credentials: written once, never read back by Melissa (the owner reads them
  # with root's admin kubeconfig: `sudo melissa-server app-credentials <app>`).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # The user's force delete removes pods stuck in a terminating app namespace (grace 0).
  # Delete only: Melissa never creates bare pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # app_exec: one command in an app's running container (e.g. a game server's console), only
  # for the agent that owns the workspace or the lead agent, always confirmed by the user and
  # audited. kube-rs execs over WebSocket (an HTTP GET, authorized as `get`); the API server
  # also requires `create` for that upgrade (AuthorizePodWebsocketUpgradeCreatePermission).
  # No attach, no port-forward.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
