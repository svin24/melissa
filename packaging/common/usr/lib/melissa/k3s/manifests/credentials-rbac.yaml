# Melissa: the identity that reads an app's setup password for the owner (ServiceAccount
# melissa/melissa-credentials), separate from the read-only melissa-server and the app-install
# melissa-apps. Only the web UI's reveal/copy path uses it (server <-> browser); no agent tool
# holds it, and agents never see what it reads (docs/DECISIONS.md, 2026-11-21).
#
# Shape:
# - The melissa-app-credentials ClusterRole grants `get` on Secrets, nothing else (no list, no
#   watch): the server asks for the one Secret that holds the password, by name.
# - It is never bound cluster-wide. melissa-apps binds it per app namespace (RoleBinding
#   melissa-app-credentials, the only role and subject apps-rbac.yaml's policy lets it bind
#   besides its own), right before a reveal, and deletes that binding when the owner dismisses
#   the setup password. A dismissed namespace (annotation melissa.io/credentials-dismissed) never
#   gets the binding again, so Melissa cannot read that password any more; the app keeps its
#   Secret and still starts with it.
# The token reaches the server as /run/melissa-kube/credentials.kubeconfig (melissa-kubeconfig).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melissa-credentials
  namespace: melissa
automountServiceAccountToken: false
---
# Long-lived token, like melissa-server-token (see DECISIONS.md). Rotate with
# `/usr/libexec/melissa/melissa-kubeconfig rotate credentials`.
apiVersion: v1
kind: Secret
metadata:
  name: melissa-credentials-token
  namespace: melissa
  annotations:
    kubernetes.io/service-account.name: melissa-credentials
type: kubernetes.io/service-account-token
---
# Never bound cluster-wide: only per app namespace, by melissa-apps (RoleBinding
# melissa-app-credentials).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-app-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
