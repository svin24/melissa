[workspace]
resolver = "2"
members = ["crates/queen", "crates/bee", "crates/web"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"   # candidate, see docs/PLAN.md section 8
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
