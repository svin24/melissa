[workspace]
resolver = "2"
members = ["crates/agent", "crates/auth", "crates/appspec", "crates/backup", "crates/cluster", "crates/server", "crates/device", "crates/settings", "crates/voice", "crates/web"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
melissa-agent = { path = "crates/agent" }
melissa-auth = { path = "crates/auth" }
melissa-web = { path = "crates/web" }
melissa-cluster = { path = "crates/cluster" }
melissa-appspec = { path = "crates/appspec" }
melissa-backup = { path = "crates/backup" }
melissa-settings = { path = "crates/settings" }
melissa-voice = { path = "crates/voice" }
# ACP (Agent Client Protocol) client: long-lived agent sessions (Grok `agent stdio`). Apache-2.0.
agent-client-protocol = { version = "5.3", default-features = false }
anyhow = "1"
# Hands each agent sandbox its seccomp program as a fixed child fd (bwrap `--seccomp 3`): the
# dup2 runs in a pre-exec hook inside the crate, so Melissa needs no `unsafe`. Google, Apache-2.0.
command-fds = { version = "0.3", features = ["tokio"] }
# Password hashing for logins (MIT OR Apache-2.0, RustCrypto): Argon2id, the OWASP and RFC 9106
# recommendation; no rand feature (salts come from /dev/urandom like Melissa's other secrets).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
base64 = "0.22"
# Cron expressions for scheduled jobs (MIT): standard 5-field syntax (Vixie/OCPS semantics,
# DST-aware) on jiff time zones; maintained, and no chrono needed.
croner = { version = "4", default-features = false, features = ["jiff"] }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
axum = "0.8"
http-body-util = "0.1"
# HTTP/1 client for the `melissa-server` CLI talking to the daemon on loopback. Already in the
# build through kube-rs (same versions and features), so no new crates.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# HTTPS for the one download Melissa makes herself (the speech model, Settings → Voice). Already in
# the build through kube-rs (rustls + ring, native roots), so no new crates.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12", "logging"] }
# Kubernetes API types; the feature pins the API version to the k3s in image/k3s.lock.
# Time zones for scheduled jobs (MIT OR Unlicense): the box's local zone from the system tzdb;
# already in the build.
jiff = "0.2"
k8s-openapi = { version = "0.29", features = ["v1_37"] }
# kube-rs client with rustls + ring: no OpenSSL, no cmake (aws-lc-rs) in the image build stage.
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
maud = { version = "0.27", features = ["axum"] }
rust-embed = "8"
# CommonMark + GFM parser for agent replies (MIT). No default features: no binary, no HTML
# writer; `components::markdown` renders the events itself so every text goes through maud.
pulldown-cmark = { version = "0.13", default-features = false }
# Safe statvfs for disk usage in `device_info` (no unsafe libc calls in our code). Apache-2.0 WITH
# LLVM-exception OR Apache-2.0 OR MIT; only the fs module.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs", "signal", "io-std"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Password hashing at full cost is slow unoptimised (about 1.5 s per hash in tests and the dev
# server); optimise just the hash and its compression function. Release builds are unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
