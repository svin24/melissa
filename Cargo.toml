[workspace]
resolver = "2"
members = ["crates/agent", "crates/catalog", "crates/hive", "crates/queen", "crates/bee", "crates/web"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"   # candidate, see docs/PLAN.md section 8
publish = false

[workspace.dependencies]
melissa-agent = { path = "crates/agent" }
melissa-web = { path = "crates/web" }
melissa-hive = { path = "crates/hive" }
melissa-catalog = { path = "crates/catalog" }
# ACP (Agent Client Protocol) client: long-lived agent sessions (Grok `agent stdio`). Apache-2.0.
agent-client-protocol = { version = "5.3", default-features = false }
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
axum = "0.8"
http-body-util = "0.1"
# HTTP/1 client for the `melissa-queen` CLI talking to the daemon on loopback. Already in the
# build through kube-rs (same versions and features), so no new crates.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Kubernetes API types; the feature pins the API version to the k3s in image/k3s.lock.
k8s-openapi = { version = "0.29", features = ["v1_37"] }
# kube-rs client with rustls + ring: no OpenSSL, no cmake (aws-lc-rs) in the image build stage.
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
maud = { version = "0.27", features = ["axum"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs", "signal", "io-std"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
