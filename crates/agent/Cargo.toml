[package]
name = "melissa-agent"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Melissa agent layer: pluggable backends, task dispatch, audit log"

[dependencies]
agent-client-protocol = { workspace = true }
# Files sent to the model as base64 content blocks (already in the build via kube-rs).
base64 = { workspace = true }
# Scheduled jobs: cron expressions evaluated in the box's local time zone.
croner = { workspace = true }
futures = { workspace = true }
# Egress: MCP served on each sandbox's Unix socket (hyper's HTTP/1 server, already in the
# build through axum and kube-rs; no new crates).
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `net`: the sandbox's DNS socket is handed from the bridge to the lead agent (SCM_RIGHTS).
rustix = { workspace = true, features = ["net"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Paused time for the scheduler's tests (no real sleeping).
tokio = { workspace = true, features = ["test-util"] }

# Runs inside each agent sandbox: forwards loopback ports to the lead agent's egress sockets.
[[bin]]
name = "melissa-netbridge"
path = "src/bin/melissa-netbridge.rs"

[lints]
workspace = true
