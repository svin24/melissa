[package]
name = "melissa-web"
version = "0.0.2"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Melissa web UI: axum + maud, fixed component library, embedded htmx"

[dependencies]
melissa-agent = { workspace = true }
melissa-appspec = { workspace = true }
melissa-auth = { workspace = true }
melissa-settings = { workspace = true }
melissa-voice = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
maud = { workspace = true }
pulldown-cmark = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
# Replays an action held for the password through the app (`auth::pending`); axum uses it.
tower = { workspace = true }
tracing = { workspace = true }

[features]
# The screenshot harness's fake app tools (src/fake_apps.rs). Never in normal builds.
fake-apps = []
# The screenshot harness's fake provider usage (src/fake_usage.rs). Never in normal builds.
fake-usage = []

[dev-dependencies]
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }

[lints]
workspace = true
