# Container image: build, release gate, publish, sign, verify.
# Docs: packaging/container/README.md, "Published images and CI" and "Release gate".
#
#   push to master      build, gate, publish ghcr.io/svin24/melissa:sha-<rev>, then :edge
#                       (not for docs-only pushes: see paths-ignore)
#   push tag vX.Y.Z     build, gate, publish :X.Y.Z, then :X.Y and :stable
#   workflow_dispatch   build and gate only; never publishes
#
# Build cache: the Containerfile's cache mounts (cargo registry and target, cargo-about, whisper.cpp) are
# kept between runs with actions/cache. Only pushes to master save it; other refs may read master's but never
# write one master reads; release tags build without it.
#
# Two hard gates: the sandbox escape suite (in build-gate) and the gVisor end-to-end test (its own job, on its
# own runner, started as soon as the image is built). Only the image that passed both
# (localhost/melissa:escape-tested, same image ID) is pushed, once, to its immutable tag. It is signed by digest with Melissa's cosign key (environment secrets
# COSIGN_PRIVATE_KEY, COSIGN_PASSWORD; public half packaging/container/melissa-signing.pub) and gets a
# build provenance attestation. Moving tags are added registry-side last, so they never point at an
# unsigned digest.
name: container

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    # A push to master that changes only these builds nothing: the image would be the same, so :edge
    # stays on the last image built and that commit gets no sha-<rev>. Nothing listed here may end up in
    # the image (ACKNOWLEDGMENTS.md and LICENSE do; the Containerfile COPYs no docs). Tag pushes ignore
    # path filters and always build.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

env:
  REPO: ghcr.io/svin24/melissa
  # Change to start the build cache afresh.
  CACHE_PREFIX: container-build-v1

jobs:
  build-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.gate.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-check.sh "$GITHUB_REF_NAME"

      # The runner has about 80 GB free and the build needs about 25 GB; deleting the preinstalled SDKs
      # took 60 to 90 seconds, so it happens only when space is short.
      - name: Free disk (only when short)
        run: |
          df -h /
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
          if [ "$avail" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/CodeQL"
            df -h /
          fi

      # Ubuntu support as shipped: Melissa's own AppArmor profile for its container (what install.sh
      # loads; escape-test.sh and gvisor-test.sh run the image under it and check that it applies).
      # The host's restriction stays on, and this asserts it, so the gate proves the image works on
      # Ubuntu without turning anything off (packaging/container/README.md, "Ubuntu and AppArmor").
      - name: Load Melissa's AppArmor profile (host restriction stays on)
        run: |
          # Ubuntu's default, set in case the runner image changed it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo packaging/container/apparmor.sh load
          sudo grep -E '^melissa-container ' /sys/kernel/security/apparmor/profiles
          v=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          if [ "$v" != 1 ]; then
            echo "::error::kernel.apparmor_restrict_unprivileged_userns is $v; the gate must run with Ubuntu's restriction on (1)"
            exit 1
          fi
          if ! sudo grep -E '^bwrap ' /sys/kernel/security/apparmor/profiles | grep -qv '(unconfined)$'; then
            echo "::error::Ubuntu's bwrap profile (bwrap-userns-restrict) is not loaded; the gate must run with it"
            exit 1
          fi

      # The builder's toolchain stage alone (the full build reuses the layer), for the cache key: Rust
      # artifacts are only reusable with the same rustc, and that is Fedora's current one.
      - name: Builder toolchain and cache key
        id: prep
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) podman build --layers --network=host \
            -f packaging/container/Containerfile --target toolchain -t localhost/melissa-toolchain:ci .
          rustc=$(podman run --rm --network=none localhost/melissa-toolchain:ci rustc -vV)
          echo "$rustc"
          rustc_key=$(printf '%s' "$rustc" | sha256sum | cut -c1-16)
          inputs=$(git ls-files -z Cargo.lock '*Cargo.toml' packaging/container/Containerfile \
            packaging/container/whisper.lock packaging/container/whisper-build.sh | xargs -0 cat | sha256sum | cut -c1-16)
          prefix="$CACHE_PREFIX-$rustc_key-"
          save=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then save=true; fi
          { echo "prefix=$prefix"; echo "key=$prefix$inputs"; echo "save=$save"; } >> "$GITHUB_OUTPUT"
          # Where rootless buildah keeps its cache mounts (one subdirectory each).
          echo "BUILDAH_CACHE=${TMPDIR:-/var/tmp}/buildah-cache-$(id -u)" >> "$GITHUB_ENV"

      - name: Restore the build cache
        id: cache
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDAH_CACHE }}
          key: ${{ steps.prep.outputs.key }}
          restore-keys: |
            ${{ steps.prep.outputs.prefix }}
            ${{ env.CACHE_PREFIX }}-

      # From another rustc only cargo-about's and whisper.cpp's caches are of use; an old cargo target dir
      # would only grow with artifacts nothing reads.
      - name: Drop Rust artifacts of another rustc
        if: steps.cache.outputs.cache-matched-key != '' && !startsWith(steps.cache.outputs.cache-matched-key, steps.prep.outputs.prefix)
        run: |
          for d in "$BUILDAH_CACHE"/*/; do
            if [ -d "$d/release/.fingerprint" ]; then echo "removing ${d%/}"; rm -rf "$d"; fi
          done

      # As `just container-build`: rootless, --layers, --network=host, SOURCE_DATE_EPOCH = last commit time.
      - name: Build localhost/melissa:dev
        id: build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/server/Cargo.toml | head -n 1)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) podman build --layers --network=host \
            -f packaging/container/Containerfile \
            --build-arg MELISSA_VERSION="$version" --build-arg MELISSA_REVISION="$(git rev-parse --short HEAD)" \
            -t localhost/melissa:dev .
          podman image inspect --format '{{.Id}} {{index .Labels "org.opencontainers.image.version"}} {{index .Labels "org.opencontainers.image.revision"}}' localhost/melissa:dev

      # The hard gate (README "Release gate"): only a pass from the image's own revision tags
      # localhost/melissa:escape-tested, and only that image may be published.
      - name: Release gate (sandbox escape suite in the image)
        id: gate
        run: |
          packaging/container/escape-test.sh localhost/melissa:dev
          id=$(podman image inspect --format '{{.Id}}' localhost/melissa:dev)
          tested=$(podman image inspect --format '{{.Id}}' localhost/melissa:escape-tested 2>/dev/null || true)
          if [ -z "$tested" ] || [ "$tested" != "$id" ]; then
            echo "::error::localhost/melissa:escape-tested is not the built image ($id); nothing to publish"
            exit 1
          fi
          echo "image_id=$id" >> "$GITHUB_OUTPUT"

      # After the gate, whose suite build fills the cargo target dir too. Melissa's own crates are rebuilt
      # every time (the Containerfile touches them), so they are left out.
      - name: Prune the build cache
        if: "!cancelled() && steps.build.outcome == 'success' && steps.prep.outputs.save == 'true' && steps.cache.outputs.cache-hit != 'true'"
        run: |
          if [ -z "$(ls -A "$BUILDAH_CACHE" 2>/dev/null)" ]; then
            echo "::warning::no build cache in $BUILDAH_CACHE (did buildah move its cache mounts?)"
            exit 0
          fi
          for r in "$BUILDAH_CACHE"/*/release; do
            [ -d "$r/.fingerprint" ] || continue
            rm -rf "$r/incremental" "$r/examples"
            find "$r" "$r/deps" "$r/.fingerprint" "$r/build" -mindepth 1 -maxdepth 1 \
              \( -name 'melissa*' -o -name 'libmelissa*' -o -name 'it-*' \) -exec rm -rf {} +
          done
          du -sh "$BUILDAH_CACHE"/* || true

      - name: Save the build cache
        if: "!cancelled() && steps.build.outcome == 'success' && steps.prep.outputs.save == 'true' && steps.cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILDAH_CACHE }}
          key: ${{ steps.prep.outputs.key }}

      - name: Upload the escape suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escape-test-image-log
          path: target/escape-test-image.log
          if-no-files-found: warn

      # Also on manual runs: the gvisor job tests this archive.
      - name: Save the tested image
        run: podman save --format oci-archive -o target/melissa.oci.tar localhost/melissa:escape-tested

      - name: Hand it to the publish and gvisor jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: target/melissa.oci.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Hard gate (2026-11-28; it passed every run since it was added): publish waits for it. On its own runner
  # with the image the escape gate passed, so it adds only its own ~2 minutes after build-gate.
  gvisor:
    needs: build-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load the tested image
        env:
          IMAGE_ID: ${{ needs.build-gate.outputs.image_id }}
        run: |
          podman load -q -i "$RUNNER_TEMP/image/melissa.oci.tar"
          rm -f "$RUNNER_TEMP/image/melissa.oci.tar"
          id=$(podman image inspect --format '{{.Id}}' localhost/melissa:escape-tested)
          if [ "$id" != "$IMAGE_ID" ]; then
            echo "::error::loaded image $id is not the tested one ($IMAGE_ID)"
            exit 1
          fi

      # As in build-gate: Ubuntu's restriction stays on; gvisor-test.sh loads Melissa's profile and checks it.
      - name: gVisor end to end
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          packaging/container/gvisor-test.sh localhost/melissa:escape-tested

      - name: Upload the gVisor log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gvisor-test-image-log
          path: target/gvisor-test-image.log
          if-no-files-found: ignore

  publish:
    needs: [build-gate, gvisor]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # GitHub environments (created by the owner) hold COSIGN_PRIVATE_KEY and COSIGN_PASSWORD.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      moving_tag: ${{ steps.tags.outputs.moving_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image

      # One auth file for podman, skopeo, cosign and actions/attest. It has to be ~/.docker/config.json:
      # actions/attest reads only that path (os.homedir(), ignores DOCKER_CONFIG) and wants
      # auths["ghcr.io"].auth = base64(user:pass), which is the format podman login writes. Started
      # fresh so nothing else (credsStore, other logins) is in it; removed again by "Log out".
      - name: Registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          rm -f "$HOME/.docker/config.json"
          echo "DOCKER_CONFIG=$HOME/.docker" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$HOME/.docker/config.json" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | podman login --authfile "$HOME/.docker/config.json" \
            -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          jq -e '.auths["ghcr.io"].auth | length > 0' "$HOME/.docker/config.json" >/dev/null \
            || { echo "::error::no ghcr.io auth entry in ~/.docker/config.json"; exit 1; }

      - name: Load the tested image
        env:
          IMAGE_ID: ${{ needs.build-gate.outputs.image_id }}
        run: |
          podman load -q -i "$RUNNER_TEMP/image/melissa.oci.tar"
          id=$(podman image inspect --format '{{.Id}}' localhost/melissa:escape-tested)
          if [ "$id" != "$IMAGE_ID" ]; then
            echo "::error::loaded image $id is not the tested one ($IMAGE_ID)"
            exit 1
          fi

      - name: Tags
        id: tags
        run: |
          rev=$(podman image inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' localhost/melissa:escape-tested)
          version=$(podman image inspect --format '{{index .Labels "org.opencontainers.image.version"}}' localhost/melissa:escape-tested)
          case "$GITHUB_REF" in
          refs/tags/v*)
            v=${GITHUB_REF_NAME#v}
            if [ "$version" != "$v" ]; then
              echo "::error::image version label $version is not the tag $v"
              exit 1
            fi
            immutable=$v; moving="${v%.*} stable"; moving_tag=stable ;;
          refs/heads/master)
            [ -n "$rev" ] || { echo "::error::image has no revision label"; exit 1; }
            immutable=sha-$rev; moving=edge; moving_tag=edge ;;
          *) echo "::error::no publish for $GITHUB_REF"; exit 1 ;;
          esac
          { echo "immutable=$immutable"; echo "moving=$moving"; echo "moving_tag=$moving_tag"; } >> "$GITHUB_OUTPUT"
          echo "publish $REPO:$immutable, then: $moving"

      # Pushed once. An existing immutable tag is only accepted when it already holds this image
      # (a re-run), and then it is not pushed again: a second push could recompress to another manifest
      # digest. A release tag is never moved to different bytes.
      - name: Push the tested image
        id: push
        env:
          IMAGE_ID: ${{ needs.build-gate.outputs.image_id }}
          IMMUTABLE: ${{ steps.tags.outputs.immutable }}
        run: |
          if existing=$(skopeo inspect --raw "docker://$REPO:$IMMUTABLE" 2>/dev/null); then
            config=$(printf '%s' "$existing" | jq -r '.config.digest // empty')
            if [ "$config" != "sha256:$IMAGE_ID" ]; then
              echo "::error::$REPO:$IMMUTABLE already exists with another image ($config)"
              exit 1
            fi
            digest=$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:$IMMUTABLE")
            echo "$REPO:$IMMUTABLE already holds this image ($digest); not pushing again"
          else
            podman push --digestfile "$RUNNER_TEMP/digest" localhost/melissa:escape-tested "docker://$REPO:$IMMUTABLE"
            digest=$(cat "$RUNNER_TEMP/digest")
            echo "pushed $REPO@$digest"
          fi
          [ -n "$digest" ] || { echo "::error::no digest for $REPO:$IMMUTABLE"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      # Legacy signature format (a .sig tag next to the image): podman cannot read cosign 3 bundles yet.
      # Recorded in the public Rekor transparency log.
      - name: Sign the digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::secret COSIGN_PRIVATE_KEY is not set in this environment"; exit 1; }
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false "$REPO@$DIGEST"

      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Registry-side, so every tag is the same digest (no second push, no recompression).
      - name: Moving tags
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MOVING: ${{ steps.tags.outputs.moving }}
        run: |
          for tag in $MOVING; do
            skopeo copy --preserve-digests "docker://$REPO@$DIGEST" "docker://$REPO:$tag"
            got=$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:$tag")
            [ "$got" = "$DIGEST" ] || { echo "::error::$REPO:$tag is $got, expected $DIGEST"; exit 1; }
            echo "$REPO:$tag -> $DIGEST"
          done

      - name: Log out
        if: always()
        run: rm -f "$HOME/.docker/config.json"

  # As a device would: anonymous pull (the package must be public), cosign verify, and podman refusing
  # anything not signed with Melissa's key.
  verify:
    needs: [build-gate, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      TAG: ${{ needs.publish.outputs.moving_tag }}
      IMAGE_ID: ${{ needs.build-gate.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5

      # Empty auth file: nothing from earlier logins. A private package (the first publish creates it
      # private) needs a login until the owner makes it public.
      - name: Anonymous access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo '{}' > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/config.json" >> "$GITHUB_ENV"
          podman logout --all >/dev/null 2>&1 || true
          if skopeo inspect --no-creds --raw "docker://$REPO@$DIGEST" >/dev/null; then
            echo "anonymous pull works: the package is public"
          else
            echo "::notice title=Package is private::$REPO cannot be pulled anonymously. Devices cannot install it until the owner makes the package public (GitHub → Packages → melissa → Package settings → Change visibility). Verifying with the workflow's token instead."
            printf '%s' "$GH_TOKEN" | podman login --authfile "$RUNNER_TEMP/docker/config.json" \
              -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          fi

      # Default flags check the Rekor transparency log entry too (--insecure-ignore-tlog=false).
      # --new-bundle-format=false: check the legacy .sig signature `publish` made, which is what podman
      # reads. Without it cosign 3 checks the sigstore bundles among the digest's OCI referrers instead,
      # finds actions/attest's keyless provenance and fails ("expected key signature, not certificate");
      # and with a key-signed bundle there it would accept that attestation in place of a signature.
      - name: cosign verify
        run: |
          cosign verify --new-bundle-format=false \
            --key packaging/container/melissa-signing.pub "$REPO@$DIGEST"

      # The same policy install.sh writes (trust.sh), in temporary files; registries.d is the runner
      # user's, which rootless podman reads.
      - name: podman pull with the signature policy
        run: |
          default=/etc/containers/policy.json
          [ -r "$default" ] || default=/usr/share/containers/policy.json
          policy() { # NAME KEYFILE: write $RUNNER_TEMP/NAME.json requiring KEYFILE for $REPO
            ( export SIGNED_REPO=$REPO POLICY="$RUNNER_TEMP/$1.json" POLICY_DEFAULT=$default \
                REGISTRIES_D="$HOME/.config/containers/registries.d" SIGNING_KEY="$RUNNER_TEMP/pki/$1.pub"
              . packaging/container/trust.sh
              trust_install "$2" >/dev/null )
          }
          policy melissa packaging/container/melissa-signing.pub
          jq '.transports.docker' "$RUNNER_TEMP/melissa.json"

          podman pull --signature-policy "$RUNNER_TEMP/melissa.json" "$REPO:$TAG"
          id=$(podman image inspect --format '{{.Id}}' "$REPO:$TAG")
          if [ "$id" != "$IMAGE_ID" ]; then
            echo "::error::$REPO:$TAG is image $id, the tested one is $IMAGE_ID"
            exit 1
          fi
          echo "verified pull of $REPO:$TAG: image $id, the one the gate tested"

          # Negative check: a policy with another key must refuse the same pull.
          podman rmi -f "$REPO:$TAG" >/dev/null
          mkdir -p "$RUNNER_TEMP/other"
          (cd "$RUNNER_TEMP/other" && COSIGN_PASSWORD='' cosign generate-key-pair >/dev/null)
          policy other "$RUNNER_TEMP/other/cosign.pub"
          if podman pull --signature-policy "$RUNNER_TEMP/other.json" "$REPO:$TAG" 2> "$RUNNER_TEMP/refused.txt"; then
            echo "::error::podman pulled $REPO:$TAG with a policy for a different key"
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          if ! grep -qi 'signature' "$RUNNER_TEMP/refused.txt"; then
            echo "::error::the pull failed, but not on the signature check"
            exit 1
          fi
          echo "refused with another key, as it should be"

      - name: Log out
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker"
