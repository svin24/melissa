# Melissa: the queen's identity in k3s. Read-only for now (cluster_health); writes for app
# installs come later as separate, narrower Roles. No access to Secrets.
# The queen gets a kubeconfig for this ServiceAccount from melissa-kubeconfig.service;
# it never sees k3s's admin kubeconfig.
apiVersion: v1
kind: Namespace
metadata:
  name: melissa
  labels:
    melissa.io/managed: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melissa-queen
  namespace: melissa
# Pods never run as this account; don't mount its token anywhere by default.
automountServiceAccountToken: false
---
# Long-lived token for the queen daemon (see docs/DECISIONS.md, 2026-11-18). Revoke or rotate
# with `/usr/libexec/melissa/melissa-kubeconfig rotate`. Must come after the ServiceAccount.
apiVersion: v1
kind: Secret
metadata:
  name: melissa-queen-token
  namespace: melissa
  annotations:
    kubernetes.io/service-account.name: melissa-queen
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: melissa-queen-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: melissa-queen-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: melissa-queen-read
subjects:
  - kind: ServiceAccount
    name: melissa-queen
    namespace: melissa
