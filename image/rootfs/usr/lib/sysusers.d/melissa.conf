# Group that may read the queen's k3s kubeconfig in /run/melissa-kube (written by root,
# melissa-kubeconfig.service). Only melissa-queen.service gets it (SupplementaryGroups=); no
# login user should be a member.
g melissa-kube - - -
# The headless queen and the agent CLIs it runs (melissa-queen.service, User=melissa). Not a
# login user: no password, no shell. Its home holds the agent CLIs and their logins, installed
# by `sudo melissa-setup agent <name>` (vendor installers run as this user). Fixed rather than
# DynamicUser so those logins have a stable owner and home (PLAN open question 24).
u melissa - "Melissa queen and its agents" /var/lib/melissa/home /usr/sbin/nologin
