# bootc-image-builder config for the published (downloadable) VM disk. Deliberately no
# [[customizations.user]]: a published image must not contain any account, password or key.
# The tester creates their admin account on first boot (melissa-firstboot.service).
#
# To build your own disk with your account baked in instead, copy this file and add, e.g.:
#   [[customizations.user]]
#   name = "alex"
#   key = "ssh-ed25519 AAAA... alex@laptop"
#   groups = ["wheel"]
# and point `just release-disk` at it (RELEASE_CONFIG=<file>).

# Root filesystem size. The qcow2 is sparse: it starts at ~3 GB on disk and grows with use.
# Nextcloud alone needs ~2 GB in /var (image + first-start copy); 8.6 GiB filled up in tests.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "40 GiB"
